<!doctype html>
<!-- Share-ready web shell for Engine creations (#138): full-viewport
     canvas, a loading bar over the wasm/asset fetch, and the COOP/COEP
     note hosts need for the engine's threads. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engine</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101318; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #101318; color: #cdd6e4;
      font: 15px system-ui, sans-serif; transition: opacity .4s;
    }
    #bar { width: 260px; height: 6px; border-radius: 3px; background: #232a35; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #4f8ef7; transition: width .15s; }
  </style>
</head>
<body>
  <div id="loader"><div>Loading…</div><div id="bar"><div id="fill"></div></div></div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (text) {
        var m = /\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/.exec(text);
        if (m) {
          document.getElementById('fill').style.width =
            (100 * parseFloat(m[1]) / parseFloat(m[2])) + '%';
        }
      },
      onRuntimeInitialized: function () {
        var loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 450);
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
