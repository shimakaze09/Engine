# Measures cl.exe compile cost on the constructs behind the MSVC lane's
# slow first-party translation units, on two MSVC toolsets side by side.
# Measurement only: it builds nothing the other lanes use and gates nothing.

name: MSVC compile probe

on:
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/msvc-compile-probe.yml
      - tools/ci/msvc_compile_probe.py
  workflow_dispatch:

concurrency:
  group: msvc-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.toolset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image the CI lanes use: Visual Studio 2026, MSVC 14.5x.
          - os: windows-2025-vs2026
            toolset: vs2026
          # Visual Studio 2022, MSVC 14.4x, to separate a toolset
          # regression from a long-standing code pattern.
          - os: windows-2025
            toolset: vs2022
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Run the probe
        shell: pwsh
        run: python tools/ci/msvc_compile_probe.py --out probe-out

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msvc-probe-${{ matrix.toolset }}
          path: |
            probe-out/results.json
            probe-out/logs/
            probe-out/listings/
