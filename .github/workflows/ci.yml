# Runs the Engine build, test, analysis, coverage, and benchmark gates.
# Toolchain policy (issue #130): the primary build matrix pins the canonical
# LLVM compilers from CMakePresets.json (clang-cl on Windows via the VS
# clang-cl via Ninja, clang on Linux, AppleClang on macOS) instead of the
# runner default; the presets themselves are not invoked because CI shares
# one build/ tree across Debug/Release and the Windows lane configures
# Ninja + clang-cl per the documented flow (the runner's VS generator has
# no ClangCL toolset component). MSVC and GCC are Tier 2 portability compilers validated by the
# compatibility lanes.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025-vs2026]
        config: [Debug, Release]
        # Canonical toolchain per OS (matches CMakePresets.json).
        include:
          # clang-19: the default clang 18 still reports __cpp_concepts=201907,
          # which guards out libstdc++'s <expected> (probe-verified in a
          # noble container); 19 reports 202002 and compiles it.
          - os: ubuntu-24.04
            toolchain_args: -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
          # macos-15: its Xcode 16 AppleClang compiles shaderc's tint (the
          # aggregate CTAD Xcode 15 lacks), so the Release lane cooks.
          - os: macos-15
            toolchain_args: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - os: windows-2025-vs2026
            toolchain_args: -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ---- FetchContent dependencies, built objects included ----
      # One entry per OS and configuration, since each builds them with
      # its own flags. Ninja rebuilds every output its log does not record,
      # so its log and deps database travel with the objects. Only pushes
      # to main save an entry; pull requests restore main's, which keeps
      # the repository inside its 10 GB cache quota.
      - name: Restore _deps
        id: deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/_deps
            build/.ninja_log
            build/.ninja_deps
          key: deps-v4-${{ matrix.os }}-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-${{ matrix.os }}-${{ matrix.config }}-

      # ---- Linux: install OpenGL + X11 dev headers (headless) ----
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/install-linux-deps.sh \
            clang-19 \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxtst-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev

      # Ninja + clang-cl needs the MSVC environment (headers/libs/link).
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # shaderc's toolchain is most of a cold build, so one lane per OS
      # builds it and cooks: Release (Windows adds the dx11 profile, which
      # needs a Windows host; every host cooks metal). Debug lanes run the
      # fake-shaderc cook suites instead. The engine's own bgfx backend TUs
      # stay in every lane's coverage.
      - name: Configure
        run: >
          cmake -S . -B build
          ${{ matrix.toolchain_args }}
          ${{ matrix.config == 'Debug' && '-DENGINE_BGFX_SHADERC=OFF' || '' }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DENGINE_BUILD_TESTS=ON
          -DENGINE_BUILD_TOOLS=ON

      # Parallelism bounded: the default bgfx backend builds shaderc's
      # glslang/tint/spirv-tools TUs, which OOM-kill 16GB runners under
      # an unbounded `make -j`.
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      # The web lane packages this lane's cook: shaderc cannot build under
      # Emscripten (ENGINE_WEB_COOKED_DIR).
      - name: Upload cooked shaders for the web lane
        if: matrix.os == 'ubuntu-24.04' && matrix.config == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-cooked-shaders
          path: build/assets/shaders/bgfx/cooked
          if-no-files-found: error
          retention-days: 1

      - name: Save _deps
        if: github.event_name == 'push' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/_deps
            build/.ninja_log
            build/.ninja_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Test
        run: ctest --test-dir build --parallel 4 --build-config ${{ matrix.config }} --output-on-failure --timeout 120 --label-exclude gpu

      # ---- The gpu-labelled suites on Mesa's software Vulkan (lavapipe)
      # under a virtual X display: they draw real frames and read them
      # back, so a pass that is never bound, a uniform never written or a
      # crash in the device path fails here. A software rasterizer is not
      # a hardware observation; the verify skill's renderer tier still
      # asks for one. Release only, because this is the Linux lane with
      # cooked shaders.
      - name: Test gpu suites on software Vulkan
        if: matrix.os == 'ubuntu-24.04' && matrix.config == 'Release'
        run: |
          bash .github/scripts/install-linux-deps.sh xvfb mesa-vulkan-drivers
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
            ctest --test-dir build --parallel 2 --output-on-failure --timeout 400 --label-regex gpu

      # ---- The frame the windowed coin_run play ended on, as the player
      # saw it: the test asserts only that it is a rendered picture, so a
      # human can look at what it shows. Kept on failure too.
      - name: Upload the slice's final frame
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.config == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coin-run-final-frame
          path: build/coin_run_final_frame.tga
          if-no-files-found: warn

      # ---- The bundled scene loads through the production loader with
      # every reference resolving; a dangling one fails here, not for an
      # author.
      - name: Validate bundled scenes
        if: runner.os == 'Linux'
        run: build/tools/engine_validate/engine_validate assets/main.scene

      # ---- Determinism hash artifact: every platform and configuration
      # must produce one World::state_hash through the production pipeline.
      - name: Run determinism hash
        shell: bash
        run: |
          set -euo pipefail
          # Every lane uses a single-config generator (Ninja on Windows,
          # Makefiles elsewhere); keep the multi-config fallback in case a
          # lane returns to the VS generator.
          exe="build/tests/integration/engine_integration_determinism"
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="$exe.exe"
            if [ ! -x "$exe" ]; then
              exe="build/tests/integration/${{ matrix.config }}/engine_integration_determinism.exe"
            fi
          fi
          if [ ! -x "$exe" ]; then
            echo "FAIL: determinism executable not found or not executable: $exe"
            exit 1
          fi
          "$exe" 2>&1 | tee determinism_output.txt
          hash=$(sed -n 's/.*hash=\([0-9][0-9]*\).*/\1/p' determinism_output.txt | tail -n 1)
          if [ -z "$hash" ]; then
            echo "FAIL: determinism hash was not emitted"
            exit 1
          fi
          echo "$hash" > determinism_hash.txt
          echo "Determinism hash on ${{ matrix.os }}-${{ matrix.config }}: $hash"

      - name: Upload determinism hash
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: determinism-hash-${{ matrix.os }}-${{ matrix.config }}
          path: determinism_hash.txt

      - name: Upload compile_commands.json
        if: matrix.os == 'ubuntu-24.04' && matrix.config == 'Debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compile_commands
          path: build/compile_commands.json

  # ---- Tier 2 portability compilers: MSVC and GCC Release build + test ----
  # Release so -O3/-Werror warning classes the canonical lanes cannot see
  # stay covered (issue #118's stringop-truncation was GCC-Release-only).
  compat-build:
    name: ${{ matrix.name }} compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ninja instead of the default Visual Studio generator: same
          # cl.exe conformance coverage, but MSBuild built this project with
          # poor parallelism (30-43 min vs the tier-1 Ninja lane's ~7 on the
          # same runner class).
          - name: windows-msvc
            os: windows-2025-vs2026
            toolchain_args: -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          - name: linux-gcc
            os: ubuntu-24.04
            toolchain_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Same scheme as the build matrix: saved from main only.
      - name: Restore _deps
        id: deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/_deps
            build/.ninja_log
            build/.ninja_deps
          key: deps-v4-compat-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-compat-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/install-linux-deps.sh \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxtst-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev

      # Ninja + cl needs the MSVC environment (headers/libs/link), same as
      # the tier-1 Windows lane.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # The canonical Release lanes cook; these check the engine compiles
      # and passes on another compiler, so they skip shaderc's toolchain.
      - name: Configure
        run: >
          cmake -S . -B build
          ${{ matrix.toolchain_args }}
          -DCMAKE_BUILD_TYPE=Release
          -DENGINE_BGFX_SHADERC=OFF
          -DENGINE_BUILD_TESTS=ON
          -DENGINE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Save _deps
        if: github.event_name == 'push' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/_deps
            build/.ninja_log
            build/.ninja_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Test
        run: ctest --test-dir build --parallel 4 --build-config Release --output-on-failure --timeout 120 --label-exclude gpu

  # ---- Web (Emscripten): the browser target's build and browser tests ----
  # The ENGINE_PLATFORM_WEB paths compile nowhere else, and the pages run
  # nowhere else: headless Chromium (Playwright, pinned in tests/web) drives
  # the shipped page and the lifecycle harness on SwiftShader's WebGL2. The
  # pages package the Linux Release lane's cook (shaderc cannot build under
  # Emscripten), so this lane waits for the build matrix.
  web:
    name: web (Emscripten)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # emsdk at its 6.0.10 tag; `install 6.0.10` then fetches that
      # release's toolchain by its release hash.
      - name: Checkout emsdk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: emscripten-core/emsdk
          ref: a2b92777574c2feda07994cd4f1079a3dfc151f8 # 6.0.10
          path: emsdk

      - name: Install Emscripten
        run: |
          emsdk/emsdk install 6.0.10
          emsdk/emsdk activate 6.0.10

      - name: Download cooked shaders
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-cooked-shaders
          path: web-cooked-shaders

      # Fetched sources only, from the entry the analysis lane saves on
      # main; FetchContent re-fetches any dependency whose pin changed.
      # Nothing is saved here: the Emscripten objects rebuild in minutes,
      # so the lane adds no cache entry of its own. The default generator
      # matches the one that entry's subbuilds were configured with.
      - name: Restore _deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          key: deps-v4-ubuntu-24.04-sources-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-ubuntu-24.04-sources-

      - name: Configure
        run: >
          source emsdk/emsdk_env.sh &&
          emcmake cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENGINE_TARGET_PLATFORM=Web
          -DENGINE_BUILD_TESTS=ON
          -DENGINE_BUILD_TOOLS=OFF
          -DENGINE_WEB_COOKED_DIR=${{ github.workspace }}/web-cooked-shaders

      - name: Build
        run: source emsdk/emsdk_env.sh && cmake --build build --parallel 4

      # The lockfile pins Playwright, and Playwright pins its Chromium.
      - name: Install Playwright
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell

      - name: Browser tests
        run: ctest --test-dir build --output-on-failure --timeout 300 --label-regex web

  # ---- Determinism comparison across every platform and configuration ----
  determinism-check:
    name: Cross-platform determinism
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all determinism hashes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: determinism-hash-*
          merge-multiple: false

      - name: Compare hashes across platforms
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "=== Cross-platform determinism check ==="
          hashes=()
          for dir in determinism-hash-*/; do
            file="${dir}determinism_hash.txt"
            platform=$(basename "$dir" | sed 's/determinism-hash-//')
            if [ ! -f "$file" ]; then
              echo "FAIL: missing determinism hash for $platform"
              exit 1
            fi
            h=$(cat "$file" | tr -d '[:space:]')
            if [ -z "$h" ]; then
              echo "FAIL: empty determinism hash for $platform"
              exit 1
            fi
            echo "  $platform: $h"
            hashes+=("$h")
          done
          if [ ${#hashes[@]} -ne 6 ]; then
            echo "FAIL: expected 6 platform/configuration hashes, found ${#hashes[@]}"
            exit 1
          fi
          first="${hashes[0]}"
          for h in "${hashes[@]}"; do
            if [ "$h" != "$first" ]; then
              echo "FAIL: determinism mismatch across platforms or configurations"
              exit 1
            fi
          done
          echo "PASS: all ${#hashes[@]} lanes produced identical hash: $first"

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Audit source comments
        run: python3 tools/check_source_comments.py

      - name: Audit comment quality
        run: python3 tools/check_comment_quality.py

      - name: Audit module dependencies
        run: python3 tools/check_module_deps.py

      - name: Audit dependency pins
        run: python3 tools/check_dependency_pins.py

      - name: Audit content attributes
        run: python3 tools/check_content_attributes.py

      - name: Audit test timing
        run: python3 tools/check_test_timing.py

      - name: Audit error handling
        run: python3 tools/check_error_handling.py

      - name: Audit portable fopen
        run: python3 tools/check_portable_fopen.py

      - name: Audit duplicate primitives
        run: python3 tools/check_duplicate_primitives.py

      - name: Audit asset metadata paths
        run: python3 tools/ci/check_asset_metadata_paths.py

      - name: Asset identity audit
        run: python3 tools/check_asset_identity.py

      - name: Shader variant audit
        run: python3 tools/check_shader_variants.py

      - name: Document reference audit
        run: python3 tools/check_doc_references.py

      - name: Array value-initialization audit
        run: python3 tools/check_array_value_init.py

      - name: Install cppcheck
        run: bash .github/scripts/install-linux-deps.sh cppcheck

      - name: Install Linux dependencies
        run: |
          bash .github/scripts/install-linux-deps.sh \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxtst-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev

      # The analysis, sanitizer, coverage and benchmark lanes build the
      # dependencies with flags of their own, so they share only fetched
      # sources: this lane configures without building and saves them,
      # from main only.
      - name: Restore _deps
        id: deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          key: deps-v4-ubuntu-24.04-sources-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-ubuntu-24.04-sources-

      - name: Configure (needed for FetchContent headers)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENGINE_BGFX_SHADERC=OFF

      - name: Save _deps
        if: github.event_name == 'push' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Generate binding code (needed by compile_commands.json)
        run: |
          mkdir -p build/scripting/generated
          cd scripting/include && python3 ../../tools/binding_generator/generate_bindings.py \
            engine/scripting/bindable_api.h \
            -o ../../build/scripting/generated/generated_bindings.cpp

      - name: Filter compile_commands.json (exclude FetchContent deps)
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('build/compile_commands.json')
          db = json.loads(p.read_text())
          db = [e for e in db if '/_deps/' not in e['file']]
          p.write_text(json.dumps(db, indent=2))
          "

      - name: Run cppcheck
        run: cmake --build build --target analysis

  # ---- clang-tidy (P1-M1-B2b) ----
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # clang-tidy 19+ is required: older clang reports __cpp_concepts as
      # 201907, which makes libstdc++ hide <expected> in C++23 mode.
      - name: Install clang-tidy
        run: |
          if ! bash .github/scripts/install-linux-deps.sh clang-tidy-19; then
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
              sudo tee /etc/apt/trusted.gpg.d/apt-llvm-org.asc >/dev/null
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
              sudo tee /etc/apt/sources.list.d/llvm19.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang-tidy-19
          fi

      - name: Install Linux dependencies
        run: |
          bash .github/scripts/install-linux-deps.sh \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxtst-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev

      - name: Restore _deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          key: deps-v4-ubuntu-24.04-sources-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-ubuntu-24.04-sources-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENGINE_BGFX_SHADERC=OFF

      - name: Generate binding code (needed by compile_commands.json)
        run: |
          mkdir -p build/scripting/generated
          cd scripting/include && python3 ../../tools/binding_generator/generate_bindings.py \
            engine/scripting/bindable_api.h \
            -o ../../build/scripting/generated/generated_bindings.cpp

      - name: Filter compile_commands.json (engine sources only)
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('build/compile_commands.json')
          db = json.loads(p.read_text())
          db = [e for e in db if '/_deps/' not in e['file'] and '/tests/' not in e['file'] and '/tools/' not in e['file']]
          p.write_text(json.dumps(db, indent=2))
          "

      - name: Run clang-tidy
        run: |
          python3 -c "
          import json, subprocess, sys
          db = json.loads(open('build/compile_commands.json').read())
          files = [e['file'] for e in db]
          print(f'Checking {len(files)} files...')
          result = subprocess.run(
            ['clang-tidy-19', '-p', 'build', '--warnings-as-errors=*'] + files,
            capture_output=False
          )
          sys.exit(result.returncode)
          "

  sanitizers:
    name: ASAN+UBSAN
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux dependencies
        run: |
          bash .github/scripts/install-linux-deps.sh \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxtst-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev

      - name: Restore _deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          key: deps-v4-ubuntu-24.04-sources-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-ubuntu-24.04-sources-

      - name: Configure (ASAN+UBSAN)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DENGINE_SANITIZERS=ON
          -DENGINE_BGFX_SHADERC=OFF
          -DENGINE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizer_suppressions/lsan.supp
        run: ctest --test-dir build --parallel 4 --output-on-failure --timeout 180 --label-exclude "gpu|integration|benchmark"

  # ---- TSAN (P1-M1-B3b) ----
  tsan:
    name: TSAN
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux dependencies
        run: |
          bash .github/scripts/install-linux-deps.sh \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxtst-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev

      - name: Restore _deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          key: deps-v4-ubuntu-24.04-sources-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-ubuntu-24.04-sources-

      - name: Configure (TSAN)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=thread"
          -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DENGINE_BGFX_SHADERC=OFF
          -DENGINE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test under TSAN
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizer_suppressions/tsan.supp:halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --parallel 4 --output-on-failure --timeout 180 --label-exclude "gpu|integration|benchmark"

  # ---- Code coverage (P1-M1-B4a/B4b/B4c) ----
  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: |
          bash .github/scripts/install-linux-deps.sh \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxtst-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev lcov

      - name: Restore _deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          key: deps-v4-ubuntu-24.04-sources-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-ubuntu-24.04-sources-

      - name: Configure (coverage)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="--coverage"
          -DCMAKE_CXX_FLAGS="--coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DENGINE_BGFX_SHADERC=OFF
          -DENGINE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --parallel 4 --output-on-failure --timeout 120 --label-exclude gpu

      - name: Collect coverage (lcov)
        run: |
          lcov --quiet --capture --directory build --output-file coverage_raw.info --ignore-errors mismatch,mismatch,negative,negative --rc geninfo_unexecuted_blocks=1
          lcov --quiet --remove coverage_raw.info '*/build/_deps/*' '*/tests/*' '*/tools/*' '/usr/*' --output-file coverage.info --ignore-errors unused,unused
          lcov --summary coverage.info

      - name: Generate HTML report
        run: genhtml --quiet coverage.info --output-directory coverage_html --title "Engine Coverage"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage_html/

      - name: Coverage threshold gate
        run: |
          LINE_PCT=$(lcov --summary coverage.info 2>&1 | grep -oP 'lines\.*:\s*\K[0-9.]+')
          echo "Line coverage: ${LINE_PCT}%"
          python3 -c "
          import math, sys
          pct = float('${LINE_PCT}' or 'nan')
          threshold = 50.0
          if not math.isfinite(pct):
              print('FAIL: scraped line coverage is not a finite number')
              sys.exit(1)
          if pct < threshold:
              print(f'FAIL: line coverage {pct}% is below threshold {threshold}%')
              sys.exit(1)
          print(f'PASS: line coverage {pct}% >= {threshold}% threshold')
          "

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux dependencies
        run: |
          bash .github/scripts/install-linux-deps.sh \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxtst-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev

      - name: Restore _deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          key: deps-v4-ubuntu-24.04-sources-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-ubuntu-24.04-sources-

      - name: Configure (Release for benchmarks)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENGINE_BGFX_SHADERC=OFF
          -DENGINE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run ECS perf benchmark
        run: |
          mkdir -p bench_results
          ./build/tests/benchmark/engine_bench_ecs_perf --json-out bench_results/ecs.json
          cat bench_results/ecs.json

      - name: Run Physics perf benchmark
        run: |
          ./build/tests/benchmark/engine_bench_physics_perf --json-out bench_results/physics.json
          cat bench_results/physics.json

      - name: Perf regression check (>10% regression = fail)
        run: >
          python3 tools/ci/run_perf_gate.py
          --build-dir build
          --baseline tests/benchmark/perf_baseline.json
          --threshold 0.10
          --attempts 3

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: bench_results/

  quality-gate:
    name: Required CI quality gate
    needs:
      - build
      - compat-build
      - web
      - determinism-check
      - static-analysis
      - clang-tidy
      - sanitizers
      - tsan
      - coverage
      - benchmarks
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require all CI jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: data.get("result")
              for name, data in needs.items()
              if data.get("result") != "success"
          }
          if failed:
              for name, result in sorted(failed.items()):
                  print(f"FAIL: {name} concluded {result}")
              sys.exit(1)
          print("PASS: all CI jobs completed successfully")
          PY
