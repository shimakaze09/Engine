# Keeps every open issue classified (CLAUDE.md's class rule). A new issue
# filed through a form gets the labels its dropdown answers name: class,
# severity, area and found-by (.github/labels.json lists them). On every
# label change the issue carries `needs-triage` exactly while it lacks a
# single class label (blocker, deferred or feature), so an unclassified or
# doubly classified issue is visible in one filter. Labelling an issue
# `roadmap` pins it to the top of the tracker.
name: Issue triage

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-24.04
    if: github.event.issue.state == 'open'
    steps:
      - name: Apply form answers and the needs-triage marker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const params = { owner: context.repo.owner, repo: context.repo.repo,
                             issue_number: issue.number };
            let labels = issue.labels.map((l) => l.name);

            // An issue form renders each answer as "### <label>\n\n<answer>".
            const answer = (heading) => {
              const match = new RegExp(`### ${heading}\\s*\\n+([^\\n#]+)`)
                .exec(issue.body || '');
              const text = match ? match[1].trim() : '';
              return text === '_No response_' ? '' : text;
            };

            const CLASSES = ['blocker', 'deferred', 'feature'];
            const FOUND = ['audit', 'observed', 'regression'];
            const AREAS = ['core', 'math', 'platform', 'content', 'render', 'physics',
                           'audio', 'scripting', 'runtime', 'editor', 'tools-ci', 'docs'];

            if (context.payload.action === 'opened') {
              let add = [];
              const cls = answer('Class').split(' ')[0];
              if (CLASSES.includes(cls)) {
                add.push(cls);
              }
              const severity = answer('Severity').slice(0, 2);
              if (/^P[0-3]$/.test(severity)) {
                add.push(severity);
              }
              for (const area of answer('Area').split(',')) {
                if (AREAS.includes(area.trim())) {
                  add.push(area.trim());
                }
              }
              let found = answer('Found by').split(' ')[0];
              // A bug report describes observed behaviour, unless the
              // issue already says where it came from.
              if (found === '' && labels.includes('bug') &&
                  !labels.some((l) => FOUND.includes(l))) {
                found = 'observed';
              }
              // A regression is a blocker whatever else the form says.
              if (answer('Is this a regression\\?').startsWith('Yes')) {
                found = 'regression';
                add = add.filter((l) => !CLASSES.includes(l));
                add.push('blocker');
              }
              if (FOUND.includes(found)) {
                add.push(found);
              }
              const fresh = add.filter((l) => !labels.includes(l));
              if (fresh.length > 0) {
                await github.rest.issues.addLabels({ ...params, labels: fresh });
                labels = labels.concat(fresh);
              }
            }

            if (context.payload.action === 'labeled' &&
                context.payload.label.name === 'roadmap') {
              await github.graphql(
                'mutation($id: ID!) { pinIssue(input: {issueId: $id}) { issue { number } } }',
                { id: issue.node_id });
            }

            const classified = labels.filter((l) => CLASSES.includes(l)).length === 1;
            const marked = labels.includes('needs-triage');
            if (!classified && !marked) {
              await github.rest.issues.addLabels({ ...params, labels: ['needs-triage'] });
            } else if (classified && marked) {
              await github.rest.issues.removeLabel({ ...params, name: 'needs-triage' });
            }
