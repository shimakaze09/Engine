# Issue form for audit findings: severity, area, evidence, failure scenario, and closure requirements per the close-finding skill.
name: Audit finding
description: A defect found by a code audit or review sweep (correctness, safety, security, determinism)
title: "[Audit] <short defect statement>"
labels: ["audit"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if this defect is one instance of a concept implemented
        in several places, file the **consolidation** instead — name every
        implementation and the gate that prevents the next copy. Instance
        fixes on a duplicated primitive increase the work remaining.

        P3 hygiene is fixed inside a change already touching its files;
        file it alone only for bounded structural value (decision 0014).
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Severity is impact, never visibility (decision 0014).
      options:
        - P0 — data loss or corruption, unrecoverable project damage, critical crash
        - P1 — major correctness or stability failure, or an important workflow that cannot reliably complete
        - P2 — user-visible functional defect, or a workflow materially obstructed but recoverable
        - P3 — low-impact debt, hygiene or cosmetics
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core
        - math
        - physics
        - renderer
        - audio
        - scripting
        - runtime
        - editor
        - tools / asset pipeline
        - build / CI
        - tests
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Exact file:line references and what the code does wrong. Cite the originating audit issue or sweep if one exists.
      placeholder: "physics/src/ccd.cpp:233-242 — reads live RigidBody::velocity while chunk jobs write it; N-08 in campaign record #87"
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure scenario
      description: Concrete inputs/state → wrong output, crash, or corruption. What does a user or test observe?
    validations:
      required: true
  - type: textarea
    id: closure
    attributes:
      label: Closure requirements
      description: "Per the close-finding skill, tiered by severity. P0/P1: the regression that must be red on base and green on the fix, plus required boundary/fault-injection coverage. P2: a test that would have caught it. P3: none — fixed inside a change that already touches these files, or alone for bounded structural value. Partial fixes link a follow-up issue for the remaining scope."
    validations:
      required: true
  - type: input
    id: origin
    attributes:
      label: Origin
      description: Audit issue / PR review / sweep that produced this finding
      placeholder: "N-08 (campaign record #87); PR #63 review"
