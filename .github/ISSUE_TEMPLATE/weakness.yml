# Issue form for maintainability, coverage, performance, and design weaknesses that are not active defects.
name: Weakness / tech debt
description: A maintainability, test-coverage, performance, or design weakness that is not an active defect
title: "[Debt] <what is weak and where>"
labels: ["tech-debt"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Missing test coverage
        - Performance / scalability risk
        - Design / architecture debt
        - Documentation gap
        - Tooling / CI gap
        - Duplication (one concept, several implementations — see the consolidate-primitive skill)
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Class
      description: Decides the work order (CLAUDE.md). Blockers are fixed first; a deferred item rides inside a change already touching its files.
      options:
        - blocker — data loss, a crash, a leak, a regression, or a defect normal use hits
        - deferred — real, but off the normal path (extreme capacity, contrived input, hygiene, cosmetics, debt with no symptom)
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Severity is impact, never visibility; anything observed in real use is at least P2.
      options:
        - P0 — data loss or corruption, unrecoverable project damage, critical crash
        - P1 — major correctness or stability failure, or an important workflow that cannot reliably complete
        - P2 — user-visible functional defect, or a workflow materially obstructed but recoverable
        - P3 — low-impact debt, hygiene or cosmetics
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Every subsystem the defect or feature touches; each becomes an `area:*` label.
      multiple: true
      options:
        - core
        - math
        - physics
        - render
        - audio
        - scripting
        - runtime
        - content
        - editor
        - platform
        - tools-ci
        - docs
    validations:
      required: true
  - type: dropdown
    id: found
    attributes:
      label: Found by
      options:
        - use — observed running the engine, or a CI failure
        - audit — code reading
        - regression — introduced by an earlier change (name it below)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is weak, and where
      description: File/system references plus why it matters (what it blocks, what it risks, what it costs later).
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: Suggested direction
      description: Sketch of the fix or the decision needed; note if it requires an owner decision or a behavior version.
