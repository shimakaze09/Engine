# Issue form for bug reports: class, severity, area, reproduction, expected vs actual, platform, and regression status.
name: Bug report
description: Observed misbehavior in the engine, editor, tools, or a sample
title: "[Bug] <what goes wrong>"
labels: ["bug"]
body:
  - type: dropdown
    id: class
    attributes:
      label: Class
      description: Decides the work order (CLAUDE.md). Blockers are fixed first; a deferred item rides inside a change already touching its files.
      options:
        - blocker — data loss, a crash, a leak, a regression, or a defect normal use hits
        - deferred — real, but off the normal path (extreme capacity, contrived input, hygiene, cosmetics, debt with no symptom)
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Severity is impact, never visibility; anything observed in real use is at least P2.
      options:
        - P0 — data loss or corruption, unrecoverable project damage, critical crash
        - P1 — major correctness or stability failure, or an important workflow that cannot reliably complete
        - P2 — user-visible functional defect, or a workflow materially obstructed but recoverable
        - P3 — low-impact debt, hygiene or cosmetics
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Every subsystem the defect or feature touches; each becomes an `area:*` label.
      multiple: true
      options:
        - core
        - math
        - physics
        - render
        - audio
        - scripting
        - runtime
        - content
        - editor
        - platform
        - tools-ci
        - docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps from a fresh checkout or the shipped template. Include the scene/asset/script if content-dependent.
      placeholder: |
        1. File → Load Scene → assets/main.scene
        2. Press Play
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include log output, stack traces, or screenshots.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform / build
      description: OS, compiler, Debug/Release, commit SHA
      placeholder: "Windows 11, clang-cl, Debug, 14f9d1b"
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      options:
        - Unknown
        - "Yes — worked in an earlier commit (name it below)"
        - "No — never worked"
  - type: textarea
    id: notes
    attributes:
      label: Additional context
